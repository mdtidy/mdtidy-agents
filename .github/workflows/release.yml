name: Release

# Continuous publish: every push to main that touches the package publishes a
# new @mdtidy/mcp via OIDC trusted publishing. Version = MAJOR.MINOR (from
# adapters/mcp/package.json) + .<run_number>. Bump MAJOR.MINOR in that
# package.json to signal a minor/breaking change. Spec §5.2.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'adapters/**'
      - 'contract/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'

concurrency: release

permissions:
  contents: write # push the version tag
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Compute version (base MAJOR.MINOR + run number)
        id: ver
        run: |
          base=$(node -p "require('./adapters/mcp/package.json').version.split('.').slice(0,2).join('.')")
          full="$base.${{ github.run_number }}"
          echo "version=$full" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing @mdtidy/mcp@$full"

      - name: Stamp version + build
        working-directory: adapters/mcp
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version
          pnpm build

      - name: Publish to npm (OIDC + provenance)
        working-directory: adapters/mcp
        run: npm publish --provenance --access public

      - name: Tag the source commit
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
